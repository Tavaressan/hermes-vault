# Exemplo de ~/.hermes/config.yaml.
# O arquivo real NÃO é versionado. Segredos vão em ~/.hermes/.env, nunca aqui.
#
# Depois de copiar, rode `hermes doctor --fix` para migrar o esquema
# (sem isso o doctor acusa "Config version outdated (v0 → v33)").

model:
  # Assinatura Claude Pro. Requer CLAUDE_CODE_OAUTH_TOKEN em ~/.hermes/.env,
  # gerado no desktop com: claude setup-token
  default: claude-opus-5
  provider: anthropic

# Failover automático em 429, 529, 503 ou falha de conexão.
# Descomente se houver OPENROUTER_API_KEY no .env.
# fallback_providers:
#   - provider: openrouter
#     model: anthropic/claude-opus-4.6

# NÃO adicione um fallback para Ollama numa instância em nuvem: não há Ollama lá.
# E mesmo no iMac ele é inútil — 1,90 tok/s, ver 20-estudos/ollama-tuning-imac-2015.

memory:
  memory_enabled: true
  user_profile_enabled: true
