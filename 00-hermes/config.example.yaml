# Exemplo de ~/.hermes/config.yaml — copie para a máquina nova e ajuste.
# O arquivo real NÃO é versionado: contém caminhos de máquina e pode conter segredos.
# Segredos vão em ~/.hermes/.env, nunca aqui.

model:
  # Modelo criado localmente a partir de granite4:7b-a1b-h com num_ctx e num_thread fixados.
  # Ver 20-estudos/ollama-tuning-imac-2015 para o Modelfile e os números de benchmark.
  default: "granite4-agent"
  provider: "custom"
  base_url: "http://localhost:11434/v1"

# Acionado quando o modelo local falha ou não dá conta da tarefa.
# Limites do free tier da OpenRouter (verificado em 2026-08-06): 20 req/min,
# 50 req/dia sem créditos, 1000 req/dia após compra única de US$ 10.
fallback_providers:
  - provider: openrouter
    model: nvidia/nemotron-3-ultra-550b-a55b:free
  - provider: openrouter
    model: openai/gpt-oss-20b:free
  # Só compensa depois da compra única de US$ 10, que eleva o teto para 1000 req/dia:
  # - provider: openrouter
  #   model: anthropic/claude-sonnet-4

memory:
  # Caminho não é configurável: o Hermes usa sempre $HERMES_HOME/memories/.
  # A integração com o vault é feita por symlink — ver setup-windows.md.
  enabled: true
